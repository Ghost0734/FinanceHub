name: FinPilot CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # --------------------------------------------------
  # 1. BACKEND TESTS
  # --------------------------------------------------
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  # --------------------------------------------------
  # 2. FRONTEND BUILD
  # --------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # --------------------------------------------------
  # 3. BUILD AND PUBLISH DOCKER IMAGES TO GHCR
  # --------------------------------------------------
  publish-images:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: image-owner
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image-owner.outputs.owner }}/financehub-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image-owner.outputs.owner }}/financehub-frontend:latest

  # --------------------------------------------------
    # 4. DEPLOY TO AWS THROUGH SYSTEMS MANAGER
  # --------------------------------------------------
  deploy:
    name: Deploy to AWS EC2 via SSM
    runs-on: ubuntu-latest

    needs: publish-images

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate with AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::768807472213:role/FinanceHubGitHubDeployRole
          aws-region: ap-south-1

      - name: Deploy FinanceHub through SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-05f325af07d4c8a24"

          echo "Sending deployment command to FinanceHub EC2..."

          PARAMETERS=$(jq -n '{
            commands: [
              "set -eu",
              "cd /home/ubuntu/finpilot",
              "test -f compose.prod.yaml",
              "echo Pulling updated FinanceHub images...",
              "docker pull ghcr.io/ghost0734/financehub-backend:latest",
              "docker pull ghcr.io/ghost0734/financehub-frontend:latest",
              "echo Deploying FinanceHub...",
              "docker compose -f compose.prod.yaml up -d --remove-orphans",
              "echo Checking container status...",
              "docker compose -f compose.prod.yaml ps",
              "docker image prune -f",
              "echo FinanceHub deployment completed."
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy FinanceHub from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                break
                ;;
              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                echo "Deployment failed. Fetching command output..."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment did not succeed within the timeout."
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json